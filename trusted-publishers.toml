# CI publisher decisions require an explicit crate list; no wildcards are allowed.
[[ci-publishers]]
trusted-publisher = "github:wasm-bindgen/wasm-bindgen"
crates = [
  "wasm-bindgen",
  "wasm-bindgen-macro",
  "wasm-bindgen-macro-support",
  "wasm-bindgen-shared",
  "wasm-bindgen-futures",
  "js-sys",
  "web-sys",
]
name = "wasm-bindgen GitHub release pipeline"
criteria = "safe-to-run"
start = "2026-10-30"
end = "2027-11-10"
notes = """
Selected by the operator on 2026-11-11 after AI-assisted trust-policy research.
Accept the canonical wasm-bindgen maintainers' contributions, build and release
workflow, packaging, proc-macros and generated JavaScript/Web API bindings for
the seven explicitly listed crates. Match the exact repository publisher in
crates.io release provenance; this does not extend Alex Crichton's account trust
to a different identity. The start covers the currently locked releases and the
fixed cutoff requires deliberate renewal. No other crates from this repository,
other repositories or individual account publishers are accepted by this entry.
This is scoped upstream-release acceptance, not an independent source review.
Source: https://github.com/wasm-bindgen/wasm-bindgen
"""
