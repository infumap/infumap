# Shared account and scoped CI publisher policy for both Rust projects.
# Numeric IDs are crates.io account IDs; CI identities name exact repositories.
# List audit sources below to automatically trust their publishers on every audit.
# For example: sources = ["mozilla", "bytecode-alliance"] trusts either source's publishers.
# Run python3 sync-publisher-trust.py to apply changes, or add --dry-run to preview.
# start is inclusive; end is exclusive, using UTC publication dates.
# Dates are deliberately fixed: renew them here only after reconsidering trust.
# sync-publisher-trust.py owns the trusted tables in each supply-chain/audits.toml.

[inherit]
sources = ["mozilla", "bytecode-alliance"]
end = "2028-11-10"

# Optional individual decisions; these take precedence over inherited trust.
# Add one with: python3 sync-publisher-trust.py --trust BurntSushi
# The helper requires an existing audit-source endorsement. The entries below
# instead record the operator's explicit upstream-maintainer decisions on
# 2026-11-11, following the AI-assisted trust-options assessment.
# Each start includes the earliest currently locked release by that account.
# These decisions apply publisher-wide, including future dependencies published
# by these accounts. They accept safe-to-run based on reputation and release
# provenance, rather than certifying an independent source or cryptographic audit.
# The fixed end dates require deliberate renewal; synchronization preserves notes
# in the generated cargo-vet records for both projects.

