[package]
name = "infumap-web-search"
version = "0.8.0"
edition = "2024"
rust-version = "1.89"

[[bin]]
name = "infumap-web-search"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytes = "1.6.0"
chromiumoxide = { version = "0.9.1", default-features = false }
env_logger = "0.11"
futures-util = { version = "0.3.30" }
http-body-util = "0.1.1"
hyper = { version = "1.3.1", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.6", default-features = false, features = ["tokio"] }
htmd = "0.5"
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
log = "0.4.21"
once_cell = "1.19.0"
rand = "0.8"
reqwest = { version = "0.12.4", default-features = false, features = ["json", "rustls-tls-native-roots", "gzip", "deflate", "brotli", "stream"] }
scraper = "0.23"
serde = { version = "1.0.202", features = ["derive"] }
serde_json = "1.0.117"
tempfile = "3.23"
tokio = { version = "1.37.0", features = ["full"] }
