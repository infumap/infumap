notes = """
Reviewed-at: 2026-11-11T19:54:12+07:00. Report: dependency-reviews/2026-11-11_194741+0700.md. Full exact-version AI source review; criterion safe-to-run under DEPENDENCY_REVIEW.md's operator-vetted-input model. Both manifests and all production src/{lib,bitstream,constants,decoder,encoder,errors,gzip_constants,utils,crc}.rs, empty encoder/fast_match_finder, and CRC numeric tables. DeflateDecoder builds bounded-size Huffman tables, decodes literals/backreferences/stored blocks from caller bytes into Vec storage and reports format/checksum errors with partial data. The stream over-read accounting detects consumption of synthetic padding; backreferences reject offsets beyond the current output. Copy routines use safe slices/copy_within/Cell windows rather than raw machine I/O. Adler uses the declared simd-adler32 dependency. Optional gzip scans embedded filename/comment bytes but does not open those names; its CRC/ISIZE checks are local. DeflateEncoder emits uncompressed deflate/zlib into memory. CRC tables were structurally verified as declarations and hexadecimal literals only; their mathematical values were not recomputed. No filesystem/env/credential access, endpoint, process, native payload or build script.

Parent EXR 1.74.3 enables only zlib/simd-adler32 (std and gzip inactive). ZIP, PXR24 and DWA call decode_zlib after setting both size_hint and limit to expected byte counts (src/compression/zip.rs:20-24, pxr24.rs:167-173, dwa/section_stream.rs:29-44); DWA also checks final length. Optional std/gzip and encoder branches were read even though not exercised by these callers.

Nonblocking output-limit observation. decoder.rs::start_deflate_block initially allocates size_hint before comparing it to limit (598). Stored blocks grow storage before checking the old dest_offset (656-681), then copy/advance and can finish without checking the new size (684-698). Literal branches likewise increment dest_offset and continue without a limit check (793-842,1106-1112); final return has no universal size check (1216-1218). Thus limit is not a hard allocation/output cap: a final stored block or a literal-only block can return more bytes than requested. These source paths affect EXR's configured limits; exact end-to-end rejection/impact depends on the caller, and no malformed EXR reproducer was run. Crafted compression can undermine intended availability limits, but no hidden computation or unexpected sensitive/unrelated machine effect under operator-vetted inputs was established. Record as nonblocking resource-hardening evidence, not a safe-to-deploy claim, fix or proof of exploitability.

Scope/limits: No exhaustive Huffman/arithmetic/format proof or compression-bomb resistance claim. Even checked match paths can allocate before enforcing the limit and overshoot by a decoding step. Optional encoder/gzip correctness and simd-adler32 internals retain separate limitations. No builds or tests run; no safe-to-deploy or publisher-wide trust claim. No concerning changes found within the reviewed scope; certified safe-to-run."""

