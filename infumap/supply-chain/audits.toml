notes = "Reviewed-at: 2026-11-12T06:08:32+07:00. Report: dependency-reviews/2026-11-12_060311+0700.md. Full exact-version AI source review under DEPENDENCY_REVIEW.md; safe-to-run only.\nEvidence: Both manifests and all production src/{lib,config,store,ddsketch,encoding}.rs, including the complete public Java-compatible encoder/decoder before its inline tests. Also inspected package inventory, standalone dev lockfile sources, Makefile and release workflow. Config/Store/DDSketch derive routing and serde fields were read, not executed.\nBehavior/reasoning: Config maps floating-point values to logarithmic bin indices. DDSketch maintains positive/negative dense stores plus zero count and summary statistics, merges compatible sketches and estimates quantiles. Store grows/collapses owned Vec<u64> bins; defaults allow 2048 bins per sign. Java encoding writes only a Vec, and decoding consumes a caller byte slice through checked byte fetches and bounded-length varint operations, populating local stores. Every bin decode iteration consumes input or returns an error; there is no synthetic spin based solely on an encoded bin count. Tantivy 0.27.0 src/aggregation/metric/percentiles.rs:143-249 constructs default sketches, adds values, merges/queries them and exposes Java-format output. Active features serde/use_serde serialize the owned state through the caller. No unsafe/FFI, build script, filesystem/env/credential access, endpoint, process, installation or background work.\nNonblocking findings: Nonblocking input-validation observation: the public Java decoder accepts signed indices narrowed to i32 (encoding.rs:277-317::decode_store), then Store computes i32 range spans and offsets with unchecked arithmetic (store.rs:72-106,159-162). Extreme or inconsistent crafted bin ranges can overflow these calculations and panic under overflow checking or later invalid indexing. Serde also derives Deserialize directly for internal store/config fields without a validation step, so deserialized state is not guaranteed to obey constructor invariants. This is hostile-input availability/invariant-hardening evidence; no end-to-end Infumap exploit was established or run. The inspected Tantivy wrapper emits Java bytes and uses default constructors, though its serde-derived intermediate collector can deserialize sketch state. No unexpected sensitive/unrelated machine effect was established under operator-vetted inputs.\nLimits: No statistical error-bound, complete numerical-overflow, malformed serialization or aggregate-memory proof. Bin limits do not bound number of application sketches, total update count or externally deserialized Vec sizes. Independent Serde behavior and application transport/admission policy remain separate. No accepted delta base needed. No builds or tests run; no safe-to-deploy or publisher-wide trust claim. No concerning changes found within the reviewed scope; certified safe-to-run."

