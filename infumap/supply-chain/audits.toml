[[audits.attohttpc]]
who = "Codex (AI reviewer)"
criteria = "safe-to-run"
version = "0.30.1"
notes = """
Reviewed-at: 2026-11-11T13:31:56+07:00
Report: dependency-reviews/2026-11-11_131354+0700.md (dated criterion reassessment)
Full AI source review of attohttpc 0.30.1: both manifests; lib/request builder, body, settings, proxy, session and send loop; streams/happy; all TLS backends; parsing/response/buffer/chunk/compression/text modules; multipart/lazy writer, error/charset and development I/O paths. HTTP uses caller URLs and configured proxies; bounded redirects and DNS racing implement client behavior. File bodies read caller-selected inputs. TLS verification defaults on, bypasses require explicit danger APIs; no hidden installation, unrelated filesystem mutation, credential-file collection or unexplained upload destination found.
Nonblocking Windows ownership defect remains: streams.rs::connect_tcp:145 borrows a raw socket, then its deadline worker calls closesocket at 167 while TcpStream remains owner; its destructor later closes the value again. aws-creds supplies a 30-second total deadline by default. Ordinary timeouts can expose this stale ownership; descriptor reuse/connection disruption is a credible potential consequence. Source defect confirmed statically, but Windows interleaving, cross-connection data I/O, credential disclosure and unrelated data damage were not reproduced or established. This supersedes the earlier AI safe-to-run violation: a transport correctness/availability defect alone does not establish this workflow's specified harmful machine effects. The finding is retained, not fixed or disproved. Unix uses a cloned stream and shutdown. No unsafe-code soundness or safe-to-deploy claim.
Other nonblocking observations: cross-origin redirects retain request headers/body/method and can disclose credentials under hostile responses; container-token acquisition disables redirects, IMDS token calls do not. no_proxy uses bare suffix matching. Debug logs may expose credential-bearing query strings when enabled. Acceptance assumes operator-vetted inputs/endpoints and records these limitations; dependencies retain separate vet requirements. No builds, reproducer or tests run."""

