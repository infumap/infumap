notes = "Reviewed-at: 2026-11-12T06:08:32+07:00. Report: dependency-reviews/2026-11-12_060311+0700.md. Full exact-version AI source review under DEPENDENCY_REVIEW.md; safe-to-run only.\nEvidence: Published Cargo.toml (no Cargo.toml.orig is packaged); all production src/{lib,encode,decode,io_support,entities}.rs, package inventory, README, benchmark entry and .travis.yml. The 252 named entity rows were structurally verified as literal name/Unicode-character pairs, with the five minimal entity strings read directly.\nBehavior/reasoning: The encoder traverses caller text, replacing HTML delimiters or attribute punctuation with entities. The decoder consumes caller UTF-8 through a small entity-state machine, resolves literal tables/numeric character values, and writes to the supplied Write object; convenience helpers use local Vec/Cursor storage. io_support implements UTF-8 conversion and interrupted-read retries without selecting any file or endpoint. There is no build script, dependency proc-macro, unsafe block, environment discovery, credential access or autonomous process/network action. Tantivy 0.27.0 src/snippet/mod.rs:152-167 calls encode_minimal for snippet text, adding its own configured highlight tags. No crate features or runtime dependencies are declared.\nNonblocking findings: Nonblocking observations: encode.rs:132-139::write_hex uses write for the three-byte entity prefix and ignores a successful short byte count before write_all of the suffix. A caller writer accepting fewer than three bytes can therefore receive malformed entity output without an error; Vec-backed encode_attribute and Tantivy encode_minimal do not use that failing path. This is output correctness, not an established injection or machine-effect exploit. The packaged .travis.yml:9-10 also pipes an HTTP artifact-uploader download into sh using a CI token in the query. Executing that legacy upstream CI step could run unauthenticated remote code and expose that CI token in transit. It is not