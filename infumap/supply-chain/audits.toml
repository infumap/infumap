cuted.\nLimits: No cryptographic validation, constant-time/zeroization assessment or exhaustive unsafe/endian/arithmetic proof. Caller-selected input and output lengths determine hashing work. The original comparison workspace is removed from the normalized consumer manifest and is not a consumer build target. No accepted delta base needed. No builds or tests run; no safe-to-deploy or publisher-wide trust claim. No concerning changes found within the reviewed scope; certified safe-to-run."

